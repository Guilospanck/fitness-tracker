<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Fitness Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <!-- iOS home-screen / standalone support (works over HTTP; no service worker needed) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fitness" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="view-title">Routines</h1>
    <div id="header-actions" class="header-actions"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button data-route="routines" class="tab active">🏋️<span>Routines</span></button>
    <button data-route="history" class="tab">📅<span>History</span></button>
    <button data-route="progress" class="tab">📈<span>Progress</span></button>
    <button data-route="settings" class="tab">⚙️<span>Settings</span></button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
